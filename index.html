/* ─────────────────────────────────────────────────────────────────────────
   Module: identify (GetFeatureInfo / vector hit)
───────────────────────────────────────────────────────────────────────── */
const Identify = (() => {
  const popup = document.getElementById("popup");
  const tabsEl = document.getElementById("popup-tabs");
  const bodyEl = document.getElementById("popup-body");
  let coord;
  let overlay;
  // Tool is opt-in: default off so map clicks don't accidentally fire
  // expensive GetFeatureInfo calls to every visible service.
  let enabled = false;

  function setEnabled(on) {
    enabled = !!on;
    document.getElementById("app").classList.toggle("identify-active", enabled);
    if (!enabled && popup.classList.contains("open")) close();
  }

  function init() {
    overlay = new ol.Overlay({
      element: popup,
      autoPan: { animation: { duration: 200 } }
    });
    map.addOverlay(overlay);
    document.getElementById("popup-close").addEventListener("click", close);
    map.on("singleclick", onClick);
    // ESC closes the popup, arrow-left/right move between tabs.
    document.addEventListener("keydown", e => {
      if (!popup.classList.contains("open")) return;
      if (e.key === "Escape") { close(); return; }
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        const tabs = [...tabsEl.querySelectorAll(".tab")];
        if (!tabs.length) return;
        const cur = tabs.findIndex(t => t.getAttribute("aria-selected") === "true");
        const next = (cur + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
        tabs[next].click();
        tabs[next].focus();
        e.preventDefault();
      }
    });
    // Reposition popup on pan / zoom so it stays attached to its coord.
    map.on("moveend", () => {
      if (popup.classList.contains("open") && coord) positionPopup(coord);
    });
  }

  function close() {
    popup.classList.remove("open");
    overlay.setPosition(undefined);
  }

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, rej) => setTimeout(() => rej(new Error("Zeitüberschreitung")), ms))
    ]);
  }

  async function onClick(evt) {
    if (!enabled) return;
    coord = evt.coordinate;

    // Build a query per visible active layer, dispatch all in parallel
    // with a per-layer timeout, then render once all settle.
    const queries = ActiveLayers.items
      .filter(item => item.layer.getVisible())
      .map(item => {
        const type = item.def.type;
        const layer = item.layer;
        const job = (async () => {
          if (type === "ogc_wms") {
            const r = await queryWMS(layer, evt);
            return r ? { item, kind: "fields", data: r } : null;
          }
          if (type === "ogc_wfs" || type === "ogc_api_features" || type === "ogc_vectorTiles") {
            const features = [];
            map.forEachFeatureAtPixel(evt.pixel, (f, l) => {
              if (l === layer) features.push(f);
            }, { hitTolerance: 4 });
            if (!features.length) return null;
            return {
              item, kind: "fields",
              data: features.map(f => f.getProperties()).map(p => {
                const c = { ...p }; delete c.geometry; return c;
              })
            };
          }
          return null;
        })();
        return withTimeout(job, 10000).catch(err => ({
          item, kind: "error", data: err.message
        }));
      });

    const settled = await Promise.all(queries);
    const results = settled.filter(Boolean);
    render(results, evt.coordinate);
  }

  async function queryWMS(layer, evt) {
    const src = layer.getSource();
    const viewRes = view.getResolution();
    const projection = view.getProjection();
    const url = src.getFeatureInfoUrl(evt.coordinate, viewRes, projection, {
      INFO_FORMAT: "application/json",
      FEATURE_COUNT: 10
    });
    if (!url) return null;
    const serviceUrl = layer.get("_serviceUrl");
    let resp;
    try {
      resp = await authedFetch(serviceUrl, url);
    } catch {
      return null;
    }
    if (resp.status === 401 || resp.status === 403) {
      handleAuthError(layer);
      throw new Error("Authentifizierung erforderlich");
    }
    if (!resp.ok) return null;
    const ct = (resp.headers.get("content-type") || "").toLowerCase();
    if (ct.includes("json")) {
      const j = await resp.json();
      if (j.features && j.features.length) {
        return j.features.map(f => f.properties || {});
      }
      return null;
    }
    const body = await resp.text();
    if (!body.trim()) return null;
    // MapServer / GeoServer / OGC return ServiceException XML when
    // GetFeatureInfo is disabled (or the layer isn't queryable). Detect
    // and drop instead of showing the raw error text to the user.
    if (ct.includes("xml") || /<ServiceException|msWMSDispatch|ows_enable_request|request not enabled/i.test(body)) {
      return null;
    }
    return { _html: safeHtml(body) };
  }

  function handleAuthError(layer) {
    const url = layer.get("_serviceUrl");
    TokenDialog.open(url, layer.get("_def")?.name || "");
  }

  function render(results, coordinate) {
    tabsEl.innerHTML = "";
    bodyEl.innerHTML = "";
    if (results.length === 0) {
      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = "Keine Informationen an dieser Stelle.";
      bodyEl.appendChild(div);
      popup.classList.add("open");
      overlay.setPosition(coordinate);
      positionPopup(coordinate);
      return;
    }

    results.forEach((r, idx) => {
      const tab = document.createElement("button");
      tab.className = "tab";
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-selected", String(idx === 0));
      tab.textContent = (r.item.def.name || r.item.layerKey).slice(0, 28);
      tab.addEventListener("click", () => activate(idx));
      tabsEl.appendChild(tab);
    });

    function activate(idx) {
      [...tabsEl.children].forEach((t, i) => t.setAttribute("aria-selected", String(i === idx)));
      bodyEl.innerHTML = "";
      const r = results[idx];
      if (r.kind === "error") {
        const div = document.createElement("div");
        div.className = "empty";
        div.textContent = r.data;
        bodyEl.appendChild(div);
        return;
      }
      if (Array.isArray(r.data)) {
        for (const props of r.data) {
          bodyEl.appendChild(renderFields(props));
        }
      } else if (r.data && r.data._html) {
        const wrap = document.createElement("div");
        // _html is already DOMPurify-sanitised via safeHtml(); assigning
        // it to innerHTML reinflates the parsed/cleaned subtree.
        wrap.innerHTML = r.data._html;
        bodyEl.appendChild(wrap);
      }
    }
    activate(0);
    popup.classList.add("open");
    overlay.setPosition(coordinate);
    positionPopup(coordinate);
  }

  function renderFields(props) {
    const table = document.createElement("table");
    let any = false;
    for (const [k, v] of Object.entries(props || {})) {
      if (v === null || v === undefined || v === "") continue;
      if (typeof v === "object") continue;
      any = true;
      const tr = document.createElement("tr");
      const th = document.createElement("th"); th.textContent = k;
      const td = document.createElement("td"); td.textContent = String(v);
      tr.appendChild(th); tr.appendChild(td);
      table.appendChild(tr);
    }
    if (!any) {
      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = "Keine Attribute.";
      return div;
    }
    return table;
  }

  function positionPopup(coordinate) {
    // Use Floating UI for nicer placement: anchor is screen-space pixel
    const pixel = map.getPixelFromCoordinate(coordinate);
    const mapEl = document.getElementById("map-wrap");
    const rect = mapEl.getBoundingClientRect();
    const virtualEl = {
      getBoundingClientRect: () => ({
        x: rect.left + pixel[0],
        y: rect.top + pixel[1],
        top: rect.top + pixel[1],
        left: rect.left + pixel[0],
        right: rect.left + pixel[0],
        bottom: rect.top + pixel[1],
        width: 0, height: 0
      })
    };
    if (window.FloatingUIDOM) {
      window.FloatingUIDOM.computePosition(virtualEl, popup, {
        placement: "top",
        middleware: [
          window.FloatingUIDOM.offset(10),
          window.FloatingUIDOM.flip(),
          window.FloatingUIDOM.shift({ padding: 8 })
        ]
      }).then(({ x, y }) => {
        popup.style.left = x + "px";
        popup.style.top = y + "px";
        popup.style.position = "fixed";
      });
    }
  }

  return { init, close, setEnabled };
})();

/* ─────────────────────────────────────────────────────────────────────────
   Module: token dialog
───────────────────────────────────────────────────────────────────────── */
const TokenDialog = (() => {
  const dlg = document.getElementById("token-dialog");
  const input = document.getElementById("token-input");
  const desc = document.getElementById("token-dialog-desc");
  let currentUrl;
  let pendingRetry = null;

  document.getElementById("token-save").addEventListener("click", () => {
    if (currentUrl && input.value) {
      TokenStore.set(currentUrl, input.value);
      Toast.info("Token gespeichert (nur im Speicher).");
    }
    input.value = "";
    dlg.close();
    if (typeof pendingRetry === "function") {
      const fn = pendingRetry;
      pendingRetry = null;
      try { fn(); } catch (e) { Toast.err("Wiederholung fehlgeschlagen: " + e.message); }
    }
  });
  document.getElementById("token-cancel").addEventListener("click", () => {
    input.value = "";
    pendingRetry = null;
    dlg.close();
  });

  // open(url, name)              — show dialog without retry
  // open(url, name, retryFn)     — invoke retryFn after the user saves a token
  function open(url, name, retryFn) {
    currentUrl = url;
    pendingRetry = (typeof retryFn === "function") ? retryFn : null;
    desc.textContent = "Layer „" + (name || "") + "“ verlangt einen Token für " + hostOf(url) +
      ". Der Token wird nur im Arbeitsspeicher gehalten.";
    if (typeof dlg.showModal === "function") dlg.showModal();
    else dlg.setAttribute("open", "");
    requestAnimationFrame(() => input.focus());
  }
  return { open };
})();

/* ─────────────────────────────────────────────────────────────────────────
   Module: permalink
───────────────────────────────────────────────────────────────────────── */
const Permalink = (() => {
  let timer;
  const MAX_LEN = 8192;

  function scheduleUpdate() {
    clearTimeout(timer);
    timer = setTimeout(update, 250);
  }

  function update() {
    const state = {
      c: UI.currentCatalogId,
      // Each tuple: [path, opacityPct, visibleFlag].
      // `path` is now country/[group/]layerKey to disambiguate the 94
      // (catalog,key) collisions seen across federal-state branches.
      l: ActiveLayers.items.map(i => [
        i.layerPath,
        Math.round(i.layer.getOpacity() * 100),
        i.layer.getVisible() ? 1 : 0
      ]),
      v: view.getCenter() ? [
        ...view.getCenter().map(n => Number(n.toFixed(2))),
        Number(view.getZoom().toFixed(2))
      ] : null,
      d3: document.getElementById("app").classList.contains("mode-3d") ? 1 : 0
    };
    const encoded = encodeURIComponent(JSON.stringify(state));
    const newHash = "#s=" + encoded;
    if (newHash.length > MAX_LEN) return;
    history.replaceState(null, "", newHash);
  }

  function parse() {
    const h = location.hash;
    if (!h.startsWith("#s=")) return null;
    const raw = h.slice(3);
    if (raw.length > MAX_LEN) return null;
    try {
      const obj = JSON.parse(decodeURIComponent(raw));
      if (typeof obj !== "object" || obj === null) return null;
      return obj;
    } catch { return null; }
  }

  async function restore() {
    const s = parse();
    if (!s) return false;
    if (!s.c || typeof s.c !== "string") return false;
    if (!Catalogs.index.some(e => e.name === s.c)) return false;
    if (s.v && Array.isArray(s.v) && s.v.length === 3) {
      view.setCenter([s.v[0], s.v[1]]);
      view.setZoom(s.v[2]);
    }
    // Layer-tuple element 0 may be a full path (contains "/") or a legacy
    // bare key; switchCatalog handles both via findLayerByPath/-Key.
    const layers = Array.isArray(s.l)
      ? s.l.filter(x => Array.isArray(x) && typeof x[0] === "string").map(x => {
          const first = x[0];
          const restore = {
            opacity: (Number(x[1]) || 100) / 100,
            visible: x.length < 3 ? true : x[2] !== 0 && x[2] !== false
          };
          if (first.includes("/")) restore.path = first;
          else restore.key = first;
          return restore;
        })
      : [];
    await UI.switchCatalog(s.c, layers);
    if (s.d3) ThreeD.enable();
    return true;
  }

  async function copyToClipboard() {
    try {
      await navigator.clipboard.writeText(location.href);
      Toast.info("Permalink kopiert.");
    } catch {
      Toast.err("Kopieren nicht möglich.");
    }
  }

  view.on("change", scheduleUpdate);

  return { scheduleUpdate, restore, copyToClipboard };
})();

/* ─────────────────────────────────────────────────────────────────────────
   Module: export / import
───────────────────────────────────────────────────────────────────────── */
const ExportModule = (() => {
  function pngFromMap() {
    map.once("rendercomplete", () => {
      try {
        const size = map.getSize();
        const canvas = document.createElement("canvas");
        canvas.width = size[0]; canvas.height = size[1];
        const ctx = canvas.getContext("2d");
        document.querySelectorAll("#map canvas").forEach(c => {
          if (c.width > 0) {
            const op = c.parentNode?.style?.opacity || "";
            ctx.globalAlpha = op === "" ? 1 : Number(op);
            const transform = c.style.transform;
            const m = /matrix\(([^)]+)\)/.exec(transform);
            if (m) {
              const [a, b, c2, d, e, f] = m[1].split(",").map(Number);
              ctx.setTransform(a, b, c2, d, e, f);
            } else {
              ctx.setTransform(1, 0, 0, 1, 0, 0);
            }
            ctx.drawImage(c, 0, 0);
          }
        });
        ctx.globalAlpha = 1;
        canvas.toBlob(blob => {
          if (!blob) { Toast.err("PNG-Export fehlgeschlagen (CORS-Taint?)."); return; }
          downloadBlob(blob, "karte.png");
        });
      } catch (err) {
        Toast.err("Export fehlgeschlagen: " + err.message);
      }
    });
    map.renderSync();
  }

  function sessionJson() {
    const state = {
      version: 1,
      catalog: UI.currentCatalogId,
      view: {
        center: view.getCenter(),
        zoom: view.getZoom()
      },
      layers: ActiveLayers.items.map(i => ({
        path: i.layerPath,
        opacity: i.layer.getOpacity(),
        visible: i.layer.getVisible()
      }))
    };
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    downloadBlob(blob, "gbl-session.json");
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function importSession(file) {
    if (file.size > 1024 * 1024) { Toast.err("Datei zu groß."); return; }
    const text = await file.text();
    let obj;
    try { obj = JSON.parse(text); } catch { Toast.err("Ungültiges JSON."); return; }
    if (!obj || typeof obj !== "object" || obj.version !== 1) { Toast.err("Unbekanntes Schema."); return; }
    if (typeof obj.catalog !== "string") { Toast.err("Katalog fehlt."); return; }
    if (!Catalogs.index.some(e => e.name === obj.catalog)) { Toast.err("Katalog unbekannt."); return; }

    // Strict view validation
    if (obj.view) {
      if (!Array.isArray(obj.view.center) || obj.view.center.length !== 2) {
        Toast.err("Ansicht ungültig (center)."); return;
      }
      const [x, y] = obj.view.center;
      if (!Number.isFinite(x) || !Number.isFinite(y)) { Toast.err("Ansicht ungültig (center)."); return; }
      const z = Number(obj.view.zoom);
      if (!Number.isFinite(z) || z < 0 || z > 28) { Toast.err("Ansicht ungültig (zoom)."); return; }
      view.setCenter([x, y]);
      view.setZoom(z);
    }

    // Strict layer validation: max count + opacity clamp + path/key migration
    const rawLayers = Array.isArray(obj.layers) ? obj.layers : [];
    if (rawLayers.length > 100) { Toast.err("Zu viele Layer (>100)."); return; }
    const layers = rawLayers
      .filter(l => l && ((typeof l.path === "string" && l.path.length > 0 && l.path.length < 512) ||
                         (typeof l.key === "string" && l.key.length > 0 && l.key.length < 256)))
      .map(l => ({
        path: typeof l.path === "string" ? l.path : undefined,
        key: typeof l.key === "string" ? l.key : undefined,
        opacity: Math.max(0, Math.min(1, Number(l.opacity) || 1)),
        visible: l.visible !== false
      }));

    await UI.switchCatalog(obj.catalog, layers);
    Toast.info("Sitzung importiert.");
  }

  return { pngFromMap, sessionJson, importSession };
})();

/* ─────────────────────────────────────────────────────────────────────────
   Module: 3D (lazy)
───────────────────────────────────────────────────────────────────────── */
const ThreeD = (() => {
  let ol3d = null;
  let loading = false;

  // Pinned versions + SRI hashes for lazy-loaded 3D assets. Update both
  // together when bumping the version.
  const SRI = {
    cesiumCss: "sha384-ghEeMdcWWzRv/BPeUcX835vcKDGrxvROXisl/Btpv3GeekBUXTSPVcFJpI1Tcrgp",
    cesiumJs:  "sha384-xAdxnnaIzRit+cIXQWeImuZHfoK0MA0EaxSb8rlO3RaT9NWVqgvICnDMtPUI/aar",
    olcs:      "sha384-hCdjMCQcFoYN2MuCvIfT5/s8KL8Pho5FxmbEtqO2IHcSJZYEy95aVKjNVbd7zKcD"
  };

  async function ensureLoaded() {
    if (window.olcs && window.Cesium) return true;
    if (loading) return false;
    loading = true;
    try {
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Widgets/widgets.css";
      css.crossOrigin = "anonymous";
      css.integrity = SRI.cesiumCss;
      document.head.appendChild(css);
      await loadScript("https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Cesium.js", SRI.cesiumJs);
      window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/";
      await loadScript("https://cdn.jsdelivr.net/npm/ol-cesium@2.18.0/dist/olcs.js", SRI.olcs);
      return true;
    } catch (e) {
      Toast.err("3D-Bibliotheken konnten nicht geladen werden.");
      return false;
    } finally {
      loading = false;
    }
  }

  function loadScript(src, integrity) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src;
      s.crossOrigin = "anonymous";
      if (integrity) s.integrity = integrity;
      s.onload = res;
      s.onerror = () => rej(new Error("Script load failed"));
      document.head.appendChild(s);
    });
  }

  async function enable() {
    const ok = await ensureLoaded();
    if (!ok) return;
    if (!ol3d) {
      try {
        ol3d = new window.olcs.OLCesium({ map, target: document.getElementById("map3d") });
      } catch (e) {
        Toast.err("3D-Initialisierung fehlgeschlagen.");
        return;
      }
    }
    ol3d.setEnabled(true);
    document.getElementById("app").classList.add("mode-3d");
    document.getElementById("btn-3d").setAttribute("aria-pressed", "true");
    Permalink.scheduleUpdate();
  }

  function disable() {
    if (ol3d) ol3d.setEnabled(false);
    document.getElementById("app").classList.remove("mode-3d");
    document.getElementById("btn-3d").setAttribute("aria-pressed", "false");
    Permalink.scheduleUpdate();
  }

  function toggle() {
    if (document.getElementById("app").classList.contains("mode-3d")) disable();
    else enable();
  }

  return { enable, disable, toggle };
})();

/* ─────────────────────────────────────────────────────────────────────────
   Module: Theme
───────────────────────────────────────────────────────────────────────── */
const Theme = (() => {
  const KEY_ATTR = "data-theme";
  function set(mode) {
    if (mode === "auto") document.documentElement.removeAttribute(KEY_ATTR);
    else document.documentElement.style.colorScheme = mode;
  }
  function toggle() {
    const cur = getComputedStyle(document.documentElement).colorScheme;
    const next = cur.includes("dark") ? "light" : "dark";
    const apply = () => { document.documentElement.style.colorScheme = next; };
    if (document.startViewTransition) document.startViewTransition(apply);
    else apply();
  }
  return { toggle, set };
})();

/* ─────────────────────────────────────────────────────────────────────────
   Module: Sortable wiring
───────────────────────────────────────────────────────────────────────── */
/* ─────────────────────────────────────────────────────────────────────────
   Module: Treeview keyboard navigation (WAI-ARIA pattern, single-tab-stop)
───────────────────────────────────────────────────────────────────────── */
function wireTreeKeyboard() {
  const tree = document.getElementById("tree");
  function focusable() {
    return [...tree.querySelectorAll('li.group > .row, li.layer > label')]
      .filter(el => el.offsetParent !== null);
  }
  function setActive(el) {
    focusable().forEach(n => n.tabIndex = -1);
    el.tabIndex = 0;
    el.focus();
  }
  // Initialise tabindex on every render
  const obs = new MutationObserver(() => {
    const items = focusable();
    if (items.length === 0) return;
    if (!items.some(i => i.tabIndex === 0)) {
      items.forEach(n => n.tabIndex = -1);
      items[0].tabIndex = 0;
    }
  });
  obs.observe(tree, { childList: true, subtree: true });

  tree.addEventListener("keydown", e => {
    const items = focusable();
    if (items.length === 0) return;
    const idx = items.indexOf(document.activeElement);
    if (idx < 0) return;
    const cur = items[idx];
    const li = cur.closest("li");
    switch (e.key) {
      case "ArrowDown": e.preventDefault(); setActive(items[Math.min(idx + 1, items.length - 1)]); break;
      case "ArrowUp":   e.preventDefault(); setActive(items[Math.max(idx - 1, 0)]); break;
      case "Home":      e.preventDefault(); setActive(items[0]); break;
      case "End":       e.preventDefault(); setActive(items[items.length - 1]); break;
      case "ArrowRight":
        if (li.classList.contains("group")) {
          e.preventDefault();
          if (li.getAttribute("aria-expanded") === "false") {
            li.setAttribute("aria-expanded", "true");
          } else {
            // move into first child
            const next = items[idx + 1];
            if (next) setActive(next);
          }
        }
        break;
      case "ArrowLeft":
        e.preventDefault();
        if (li.classList.contains("group") && li.getAttribute("aria-expanded") === "true") {
          li.setAttribute("aria-expanded", "false");
        } else {
          // move to parent group row
          const parentLi = li.parentElement?.closest("li.group");
          if (parentLi) {
            const parentRow = parentLi.querySelector(":scope > .row");
            if (parentRow) setActive(parentRow);
          }
        }
        break;
      case "Enter":
      case " ":
        if (cur.matches(".row")) { e.preventDefault(); cur.click(); }
        else if (cur.matches("label")) {
          // Toggle the layer's checkbox without re-firing on the native
          // label-click + checkbox-click cascade.
          const box = cur.querySelector('input[type="checkbox"]');
          if (box && !box.disabled) {
            e.preventDefault();
            box.checked = !box.checked;
            box.dispatchEvent(new Event("change", { bubbles: true }));
          }
        }
        break;
    }
  });
}

function wireSortable() {
  const list = document.getElementById("active-list");
  new Sortable(list, {
    animation: 150,
    handle: ".grip",
    ghostClass: "sortable-ghost",
    chosenClass: "sortable-chosen",
    onEnd: () => {
      const ids = [...list.querySelectorAll(".active-item")].map(el => el.dataset.id);
      ActiveLayers.reorder(ids);
    }
  });
}

/* ─────────────────────────────────────────────────────────────────────────
   Module: focus trap (small)
───────────────────────────────────────────────────────────────────────── */
function trapFocus(container) {
  const sel = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
  function onKey(e) {
    if (e.key !== "Tab") return;
    const nodes = [...container.querySelectorAll(sel)].filter(n => !n.disabled && n.offsetParent !== null);
    if (nodes.length === 0) return;
    const first = nodes[0], last = nodes[nodes.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }
  container.addEventListener("keydown", onKey);
}
trapFocus(document.getElementById("token-dialog"));
trapFocus(document.getElementById("import-dialog"));

/* ─────────────────────────────────────────────────────────────────────────
   Wiring: top bar
───────────────────────────────────────────────────────────────────────── */
document.getElementById("btn-permalink").addEventListener("click", () => Permalink.copyToClipboard());
document.getElementById("btn-3d").addEventListener("click", () => ThreeD.toggle());
document.getElementById("btn-theme").addEventListener("click", () => Theme.toggle());

document.getElementById("btn-export").addEventListener("click", () => {
  const dlg = document.getElementById("export-dialog");
  if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
});
document.getElementById("export-cancel").addEventListener("click", () => {
  document.getElementById("export-dialog").close();
});
document.getElementById("export-png").addEventListener("click", () => {
  document.getElementById("export-dialog").close();
  ExportModule.pngFromMap();
});
document.getElementById("export-json").addEventListener("click", () => {
  document.getElementById("export-dialog").close();
  ExportModule.sessionJson();
});

document.getElementById("btn-import").addEventListener("click", () => {
  const dlg = document.getElementById("import-dialog");
  const file = document.getElementById("import-file");
  file.value = "";
  if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
});
document.getElementById("import-file").addEventListener("change", async e => {
  const file = e.target.files?.[0];
  if (file) await ExportModule.importSession(file);
  document.getElementById("import-dialog").close();
});
document.getElementById("import-cancel").addEventListener("click", () => {
  document.getElementById("import-dialog").close();
});

document.getElementById("search-input").addEventListener("input", e => {
  UI.searchQuery = e.target.value;
  UI.renderTree();
});

document.querySelectorAll('#filter-pane input[name="scope"]').forEach(r => {
  r.addEventListener("change", () => {
    UI.scopeAll = document.querySelector('#filter-pane input[name="scope"]:checked').value === "all";
    UI.renderTree();
  });
});
document.querySelectorAll('#filter-pane .type-filter input[type="checkbox"]').forEach(cb => {
  cb.addEventListener("change", () => {
    UI.filterTypes.clear();
    document.querySelectorAll('#filter-pane .type-filter input[type="checkbox"]:checked')
      .forEach(c => UI.filterTypes.add(c.dataset.type));
    UI.renderTree();
  });
});

document.getElementById("sidebar-toggle").addEventListener("click", () => {
  document.getElementById("app").classList.toggle("sidebar-open");
});
document.getElementById("identify-toggle").addEventListener("change", e => {
  Identify.setEnabled(e.target.checked);
});
document.getElementById("active-handle").addEventListener("click", () => {
  const open = document.getElementById("app").classList.toggle("active-open");
  document.getElementById("active-handle").setAttribute("aria-expanded", String(open));
});

/* ─────────────────────────────────────────────────────────────────────────
   Boot
───────────────────────────────────────────────────────────────────────── */
(async function boot() {
  Identify.init();
  wireSortable();
  wireTreeKeyboard();
  try {
    await Catalogs.loadIndex();
  } catch (e) {
    Toast.err(e.message);
    return;
  }
  await UI.initCatalogDropdown();

  const restored = await Permalink.restore();
  if (!restored) {
    const firstName = Catalogs.index[0]?.name;
    if (firstName) await UI.switchCatalog(firstName);
  }
})();
</script>
